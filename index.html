<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:title" content="김수진 포트폴리오">
<meta property="og:description" content="웹디자이너 김수진 포트폴리오입니다.">
<meta property="og:image" content="https://snd01167.github.io/images/thumbnail.jpg">
<meta property="og:url" content="https://snd01167.github.io/">
<meta property="og:type" content="website">


  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김수진 포트폴리오</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow-x: hidden;
    }

    img,
    video {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
    }

    .portfolio {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    .section {
      width: 100%;
    }

    .section img {
      width: 100%;
      height: auto;
      
    }

    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 1 / 1; /* 이미지처럼 비율 고정 */
      overflow: hidden;
      background: #000;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 모든 영상 크롭 */
      display: block;
    }

    .video-guide {
      position: absolute;
      right: 20px;
      bottom: 20px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .video-guide {
        right: 12px;
        bottom: 12px;
        font-size: 12px;
        padding: 8px 12px;
      }
    }
  

    /* 02 영역: 왼쪽 큰 이미지 + 오른쪽 상하 분할 */
    .split-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }

    .split-left,
    .split-right {
      width: 100%;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* hover scale (특히 02 영역) */
    .split-left,
    .split-right .cell {
      overflow: hidden;
    }

    .split-left img,
    .split-right img,
    .split-right video {
      transition: transform 0.6s ease;
    }

    .split-left:hover img,
    .split-right .cell:hover img,
    .split-right .cell:hover video {
      transform: scale(1.03);
    }

  </style>
</head>
<body>
  <main class="portfolio">
    <section class="section">
      <img src="images/01.jpg" alt="포트폴리오 메인" />
    </section>

    <!-- MONGLE -->
    <section class="section split-hero">
      <div class="split-left">
        <img src="images/02.jpg" alt="몽글 이미지 1" />
      </div>
      <div class="split-right">
        <div class="cell video-wrap">
          <video src="videos/mongle-video.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="cell">
          <img src="images/03.jpg" alt="몽글 이미지 2" />
        </div>
      </div>
    </section>

    <section class="section">
      <img src="images/04.jpg" alt="몽글 상세페이지" />
    </section>

    <!-- POGEUN -->
    <section class="section split-hero">
      <div class="split-left">
        <img src="images/05.jpg" alt="포근 이미지 1" />
      </div>
      <div class="split-right">
        <div class="cell video-wrap">
          <video src="videos/pogeun-video.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="cell">
          <img src="images/07.jpg" alt="포근 이미지 2" />
        </div>
      </div>
    </section>

    <section class="section">
      <img src="images/08.jpg" alt="포근 상세페이지" />
    </section>

    <!-- AMUSE -->
    <section class="section">
      <img src="images/09.jpg" alt="어뮤즈 이미지 1" />
    </section>

    <section class="section split-hero">
      <div class="split-left">
        <img src="images/10.jpg" alt="어뮤즈 이미지 2" />
      </div>
      <div class="split-right">
        <div class="cell video-wrap">
          <video src="videos/amuse-video.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="cell">
          <img src="images/12.jpg" alt="어뮤즈 이미지 3" />
        </div>
      </div>
    </section>

    <section class="section">
      <img src="images/13.jpg" alt="어뮤즈 상세페이지" />
    </section>

    <!-- HOWUS -->
    <section class="section split-hero">
      <div class="split-left">
        <img src="images/14.jpg" alt="호와스 이미지 1" />
      </div>
      <div class="split-right">
        <div class="cell video-wrap">
          <video src="videos/howus-video.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="cell">
          <img src="images/16.jpg" alt="호와스 이미지 2" />
        </div>
      </div>
    </section>

    <section class="section">
      <img src="images/17.jpg" alt="호와스 상세페이지" />
    </section>
  </main>
      <script>
    const videos = document.querySelectorAll("video");
    const reveals = document.querySelectorAll(".reveal");
    const splitHeroes = document.querySelectorAll(".split-hero");

    function syncSplitHeights() {
      splitHeroes.forEach((section) => {
        const leftImg = section.querySelector(".split-left img");
        const rightCol = section.querySelector(".split-right");
        const cells = section.querySelectorAll(".split-right .cell");

        if (!leftImg || !rightCol || cells.length < 2) return;

        rightCol.style.height = "auto";
        cells.forEach((cell) => (cell.style.height = "auto"));

        const leftHeight = leftImg.getBoundingClientRect().height;
        if (!leftHeight) return;

        rightCol.style.height = `${leftHeight}px`;
        cells.forEach((cell) => (cell.style.height = `${leftHeight / 2}px`));
      });
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("active");

          if (entry.target.tagName === "VIDEO") {
            entry.target.play();
          }
        } else {
          if (entry.target.tagName === "VIDEO") {
            entry.target.pause();
          }
        }
      });
    }, { threshold: 0.3 });

    reveals.forEach(el => observer.observe(el));
    videos.forEach(video => observer.observe(video));

    window.addEventListener("load", syncSplitHeights);
    window.addEventListener("resize", syncSplitHeights);

    document.querySelectorAll("img").forEach((img) => {
      if (!img.complete) {
        img.addEventListener("load", syncSplitHeights);
      }
    });
  </script>
</body>
</html>
